name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, "feature/clean-bundle-gitignore" ]

# Updated permissions required for modern Pages deployments
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Added Node setup for stability (highly recommended)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # You can change this to match your local Node version
      
      - name: Install dependencies
        run: npm install
      
      # Your build step with Firebase secrets intact!
      - name: Build
        run: npm run build
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}      

      # Initialize GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Upload ONLY the dist folder. This replaces peaceiris and exclude_assets entirely.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      # Deploy the artifact directly to the live site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4