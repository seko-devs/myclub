    </div>
    <div class="login-wrapper">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <div class="card login-card shadow-lg border-0">
                        <div class="card-body p-4 p-md-5">
                            <!-- Logo & Header -->
                            <div class="text-center mb-4">
                                <div class="logo-icon mb-3">
                                    <i class="bi bi-trophy-fill"></i>
                                </div>
                                <h1 class="h3 fw-bold text-dark mb-1">My Club</h1>
                                <p class="text-muted">Management Portal</p>
                            </div>

                            <!-- Login Form -->
                            <form id="login-form">
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-medium">Email Address</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-envelope text-muted"></i>
                                        </span>
                                        <input 
                                            type="email" 
                                            class="form-control border-start-0 ps-0" 
                                            id="email" 
                                            name="email"
                                            placeholder="Enter your email"
                                            required
                                        >
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="password" class="form-label fw-medium">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-lock text-muted"></i>
                                        </span>
                                        <input 
                                            type="password" 
                                            class="form-control border-start-0 ps-0" 
                                            id="password" 
                                            name="password"
                                            placeholder="Enter your password"
                                            required
                                        >
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                        <label class="form-check-label text-muted" for="remember">
                                            Remember me
                                        </label>
                                    </div>
                                    <a href="#" class="text-decoration-none small">Forgot password?</a>
                                </div>

                                <button id="signin-button" type="button" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                                </button>
                            </form>

                            <!-- Divider 
                            <div class="divider my-4">
                                <span class="divider-text text-muted small">or continue with</span>
                            </div>
                            
                            <!-- Social Login
                            <div class="d-flex gap-2 mb-4">
                                <a href="#" class="btn btn-outline-secondary flex-fill py-2">
                                    <i class="bi bi-google"></i>
                                </a>
                                <a href="#" class="btn btn-outline-secondary flex-fill py-2">
                                    <i class="bi bi-facebook"></i>
                                </a>
                                <a href="#" class="btn btn-outline-secondary flex-fill py-2">
                                    <i class="bi bi-apple"></i>
                                </a>
                            </div>

                            <!-- Register Link
                            <p class="text-center text-muted mb-0">
                                New to Sports Club? 
                                <a href="#" class="text-decoration-none fw-medium">Create an account</a>
                            </p>
                            -->
                        </div>
                    </div>

                    <!-- Footer -->
                    <p class="text-center text-muted small mt-4">
                        &copy; 2026 Sports Club Management. All rights reserved.
                    </p>
                </div>
            </div>
        </div>
       
</body>
