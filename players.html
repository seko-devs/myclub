
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Players</title>

  </head>

  <body>

    <nav-bar></nav-bar>

    <main role="main" class="container mt-5 pt-4">

      <div class="starter-template">
        <h1 class="mb-3">Players</h1>

        <div id="status" role="status"></div>

        <!-- Stays hidden until players.js confirms the user is a clubadmin -->
        <div id="players-app" hidden>

          <!-- LIST -->
          <div id="list-view">
            <div class="row g-2 align-items-center mb-3">
              <div class="col-md-5">
                <input id="search" class="form-control" placeholder="Search by name" aria-label="Search players">
              </div>
              <div class="col-md-4">
                <div class="form-check">
                  <input id="show-inactive" class="form-check-input" type="checkbox">
                  <label for="show-inactive" class="form-check-label">Show inactive players</label>
                </div>
              </div>
              <div class="col-md-3 d-grid">
                <button id="add-player" type="button" class="btn btn-primary">Add player</button>
              </div>
            </div>

            <table class="table align-middle">
              <thead>
                <tr><th>Name</th><th>Status</th><th></th></tr>
              </thead>
              <tbody id="players-body"></tbody>
            </table>
          </div>

          <!-- EDITOR (add and edit) -->
          <div id="editor-view" hidden>
            <h2 id="editor-title" class="h4">Add player</h2>

            <form id="player-form">

              <h3 class="h6 text-uppercase text-muted mt-3">Player</h3>
              <div class="row g-2 mb-3">
                <div class="col-md-6">
                  <label for="p-name" class="form-label">Name</label>
                  <input id="p-name" class="form-control" maxlength="100" required>
                </div>
                <div class="col-md-6">
                  <label for="p-surname" class="form-label">Surname</label>
                  <input id="p-surname" class="form-control" maxlength="100" required>
                </div>
              </div>

              <h3 class="h6 text-uppercase text-muted">Private details (visible to the clubadmin only)</h3>
              <div class="row g-2 mb-3">
                <div class="col-md-3">
                  <label for="p-birth" class="form-label">Birth date</label>
                  <input id="p-birth" type="date" class="form-control">
                </div>
                <div class="col-md-3">
                  <label for="p-gender" class="form-label">Gender</label>
                  <select id="p-gender" class="form-select">
                    <option value="">Not specified</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label for="p-phone" class="form-label">Phone</label>
                  <input id="p-phone" type="tel" class="form-control" maxlength="30">
                </div>
                <div class="col-md-3">
                  <label for="p-email" class="form-label">Email</label>
                  <input id="p-email" type="email" class="form-control" maxlength="200">
                </div>
              </div>

              <h3 class="h6 text-uppercase text-muted">Contacts (optional)</h3>
              <p class="form-text mt-0">
                Add as many as you want (mum, dad, grandfather...). Contacts ticked as
                emergency contact are called in the order shown here; use the arrows to reorder.
              </p>
              <div id="contacts-container"></div>

              <div class="d-flex flex-wrap gap-2 mb-4">
                <button id="add-contact" type="button" class="btn btn-sm btn-outline-primary">Add new contact</button>
                <select id="existing-contact" class="form-select form-select-sm w-auto" hidden></select>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Save</button>
                <button id="cancel" type="button" class="btn btn-outline-secondary">Cancel</button>
                <button id="toggle-active" type="button" class="btn btn-outline-danger ms-auto" hidden>Deactivate player</button>
              </div>
            </form>
          </div>

        </div>
      </div>

    </main><!-- /.container -->

  </body>
</html>
